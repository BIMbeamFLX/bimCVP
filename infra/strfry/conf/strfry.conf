##
## strfry — BIM CVP public pilot relay
## Reachable as wss://relay.bimcvp.com (via Caddy TLS).
##

db = "/app/strfry-db"

relay {
    bind = "0.0.0.0"
    port = 7777

    nofiles = 1024000
    realIpHeader = "x-forwarded-for"

    info {
        name = "BIM CVP Pilot Relay"
        description = "Signed construction coordination (BCF, IFC, IDS, building logbook). Pilot."
        pubkey = ""
        contact = "admin@bimcvp.com"
        software = "git+https://github.com/hoytech/strfry.git"
        version = ""
    }

    maxWebsocketPayloadSize = 1048576
    autoPingSeconds = 55
    enableTcpKeepalive = true
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxSubsPerConnection = 20

    # MANDATORY for a public relay (plan / BACKEND-SETUP §16.3):
    # only pilot pubkeys / project-tagged events may write.
    writePolicy {
        plugin = "/etc/whitelist.sh"
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        yesstr = 1
    }
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}
